name: 'Hyva Coding Standard'
author: 'HSFDigital'
description: 'Performs php/phtml static code analysis with the Hyva Themes Coding Standard.'

inputs:
  php_version:
    required: true
    default: "8.4"
    description: "PHP version used to do the coding standard check."

  composer_version:
    required: true
    default: "2"
    description: "The version of composer to use."

  path:
    required: false
    default: ${{ github.workspace }}/project/app/design
    description: "The directory (relative to the project root) in which the coding standard will be checked. Used when the event is not a pull request."

  extensions:
    required: false
    default: "phtml,php"
    description: "Comma separated list of file extensions to check."

  ignore:
    required: false
    default: "*/node_modules/*"
    description: "Comma separated list of patterns to ignore."

  exclude:
    required: false
    default: "Generic.Files.LineLength,Magento2.Annotation.MethodAnnotationStructure"
    description: "Comma separated list of sniffs to exclude."

runs:
  using: composite
  steps:
    - name: Checkout Project
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        path: project

    - name: Set PHP Version
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php_version }}
        extensions: imagick
        tools: composer:v${{ inputs.composer_version }}, cs2pr
        coverage: none

    - name: Install Hyva Coding Standard
      shell: bash
      run: composer create-project --no-plugins --no-dev --no-interaction hyva-themes/hyva-coding-standard ${{ github.workspace }}/hyva-cs

    - name: Get Changed Files
      shell: bash
      working-directory: project
      id: changed-files
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.sha }}
      run: echo "files=$(git diff --name-only --diff-filter=ACMRT "$BASE_SHA" "$HEAD_SHA" | xargs)" >> "$GITHUB_OUTPUT"
      if: github.event_name == 'pull_request'

    - name: Hyva Coding Standard Check
      shell: bash
      id: hyva
      continue-on-error: true
      env:
        PHPCS_IGNORE: ${{ inputs.ignore }}
        PHPCS_EXCLUDE: ${{ inputs.exclude }}
        PHPCS_EXTENSIONS: ${{ inputs.extensions }}
        PHPCS_TARGET: ${{ github.event_name == 'pull_request' && steps.changed-files.outputs.files || inputs.path }}
      run: |
        ../hyva-cs/vendor/bin/phpcs --ignore="$PHPCS_IGNORE" \
        --standard=HyvaThemes \
        --exclude="$PHPCS_EXCLUDE" \
        --report=checkstyle \
        --report-file=phpcs-report.xml \
        -q \
        --extensions="$PHPCS_EXTENSIONS" \
        -- $PHPCS_TARGET
      working-directory: project

    - name: Show Hyva Coding Standard results in PR
      shell: bash
      if: ${{ always() && steps.hyva.outcome != 'skipped' && hashFiles('project/phpcs-report.xml') != '' }}
      run: cs2pr ./phpcs-report.xml
      working-directory: project
